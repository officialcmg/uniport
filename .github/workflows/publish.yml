name: Publish SDK

# Release: bump "version" in package.json, commit, then push a matching tag:
#   git tag v0.0.8 && git push origin v0.0.8
# npm trusted publishing (OIDC) authenticates this workflow; no npm token is stored.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: npm ci
      - name: Verify tag matches package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: npm run typecheck
      - run: npm run build
      - run: npm publish
      # Rebuild demo.uniport.dev so it installs the new version (its Vercel build runs
      # `npm install uniport-sdk@latest`). Enabled by the DEMO_DEPLOY_HOOK repository
      # secret, a Vercel deploy hook URL for the uniport-demo project.
      - name: Redeploy the demo
        env:
          DEMO_DEPLOY_HOOK: ${{ secrets.DEMO_DEPLOY_HOOK }}
        if: ${{ env.DEMO_DEPLOY_HOOK != '' }}
        run: |
          # npm can take a few minutes to serve a new version; wait so the demo
          # doesn't rebuild with the previous one.
          version="$(node -p "require('./package.json').version")"
          for i in $(seq 1 40); do
            latest="$(npm view uniport-sdk dist-tags.latest 2>/dev/null || true)"
            [ "$latest" = "$version" ] && break
            sleep 15
          done
          echo "npm latest: $latest (released $version)"
          curl -fsS -X POST "$DEMO_DEPLOY_HOOK" > /dev/null
