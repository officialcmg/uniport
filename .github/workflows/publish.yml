name: Publish SDK

# Release: merge a PR that bumps "version" in package.json (npm version x.y.z
# --no-git-tag-version). On that push to main this workflow publishes the
# version to npm and creates its GitHub release (and with it the vX.Y.Z tag).
# Creating a release or pushing a vX.Y.Z tag by hand still works. Every other
# push to main finds the version already published and released, and stops.
#
# npm trusted publishing (OIDC) authenticates this workflow; no npm token is
# stored. npm trusts this repository, the workflow file name (publish.yml) and
# the npm-publish environment; keep all three.
#
# The jobs are split so that the dependencies' code never runs with a
# credential it could misuse:
#   plan     reads the version and what already exists. No dependency code.
#   build    runs the dependencies' code (npm ci, typecheck, build) with
#            read-only access and no npm identity, and hands over a tarball.
#   publish  holds the npm identity. It publishes the tarball build made, and
#            runs no install, build or package scripts.
#   release  holds write access to the repository. No dependency code.
#   demo     holds the demo's deploy hook. No dependency code.
#
# Actions are pinned to commit hashes, so a moved tag cannot change what runs
# with these permissions. Update the hash and the version comment together.

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}
      create_release: ${{ steps.plan.outputs.create_release }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Work out what this push needs
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
          if npm view "uniport-sdk@$version" version >/dev/null 2>&1; then published=true; else published=false; fi
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --silent 2>"$RUNNER_TEMP/release-check.err"; then
            released=true
          elif grep -q "HTTP 404" "$RUNNER_TEMP/release-check.err"; then
            released=false
          else
            cat "$RUNNER_TEMP/release-check.err" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$([ "$published" = false ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "create_release=$([ "$released" = false ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "$version: published=$published released=$released"

  build:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Pack the package
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/package"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    # npm's trusted publisher for uniport-sdk names this environment, so a job
    # without it cannot publish. Restrict the environment to main and v* tags in
    # the repository settings, so no other branch can use the npm identity.
    environment: npm-publish
    permissions:
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-package
          path: package
      - name: Verify the built package is the version being released
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          tarball="package/uniport-sdk-$VERSION.tgz"
          test "$(ls -A package | wc -l)" = 1
          test "$(tar -xzOf "$tarball" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")" = "$VERSION"
      - name: Publish
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: npm publish "./package/uniport-sdk-$VERSION.tgz" --ignore-scripts

  # Released after publishing, so a failed publish leaves no release behind and
  # the next run retries. The release creates a lightweight tag on the merge
  # commit, which GitHub signs, so the tag shows as Verified; a tag created by
  # GITHUB_TOKEN doesn't start another run.
  release:
    needs: [plan, publish]
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      needs.plan.outputs.create_release == 'true' &&
      (needs.publish.result == 'success' || needs.plan.outputs.publish == 'false')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and its tag
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          # The commit that set package.json to this version, not necessarily this push's.
          target="$(git log -1 --format=%H -S"\"version\": \"${TAG#v}\"" -- package.json)"
          target="${target:-$GITHUB_SHA}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            target="$(git rev-parse "$TAG^{commit}")"
          fi
          gh release create "$TAG" --target "$target" --title "Release ${TAG#v}" --generate-notes --latest

  # Rebuild demo.uniport.dev so it installs the new version (its Vercel build runs
  # `npm install uniport-sdk@latest`). Enabled by the DEMO_DEPLOY_HOOK repository
  # secret, a Vercel deploy hook URL for the uniport-demo project.
  demo:
    needs: [plan, publish]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Redeploy the demo
        if: env.DEMO_DEPLOY_HOOK != ''
        env:
          DEMO_DEPLOY_HOOK: ${{ secrets.DEMO_DEPLOY_HOOK }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          # npm can take a few minutes to serve a new version; wait so the demo
          # doesn't rebuild with the previous one.
          for i in $(seq 1 40); do
            latest="$(npm view uniport-sdk dist-tags.latest 2>/dev/null || true)"
            [ "$latest" = "$VERSION" ] && break
            sleep 15
          done
          echo "npm latest: $latest (released $VERSION)"
          curl -fsS -X POST "$DEMO_DEPLOY_HOOK" > /dev/null
