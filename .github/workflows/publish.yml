name: Publish SDK

# Release: merge a PR that bumps "version" in package.json (npm version x.y.z
# --no-git-tag-version). On that push to main this workflow publishes the
# version to npm and creates its GitHub release (and with it the vX.Y.Z tag).
# Creating a release or pushing a vX.Y.Z tag by hand still works. Every other
# push to main finds the version already published and released, and stops.
# npm trusted publishing (OIDC) authenticates this workflow; no npm token is stored.

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub release and its tag
  id-token: write # npm trusted publishing

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Work out what this push needs
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
          if npm view "uniport-sdk@$version" version >/dev/null 2>&1; then published=true; else published=false; fi
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --silent 2>"$RUNNER_TEMP/release-check.err"; then
            released=true
          elif grep -q "HTTP 404" "$RUNNER_TEMP/release-check.err"; then
            released=false
          else
            cat "$RUNNER_TEMP/release-check.err" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$([ "$published" = false ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "create_release=$([ "$released" = false ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "$version: published=$published released=$released"

      - if: steps.plan.outputs.publish == 'true'
        run: npm ci
      - if: steps.plan.outputs.publish == 'true'
        run: npm run typecheck
      - if: steps.plan.outputs.publish == 'true'
        run: npm run build
      - if: steps.plan.outputs.publish == 'true'
        run: npm publish

      # Released after publishing, so a failed publish leaves no release behind and
      # the next run retries. The release creates a lightweight tag on the merge
      # commit, which GitHub signs, so the tag shows as Verified; a tag created by
      # GITHUB_TOKEN doesn't start another run.
      - name: Create the GitHub release
        if: steps.plan.outputs.create_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          # The commit that set package.json to this version, not necessarily this push's.
          target="$(git log -1 --format=%H -S"\"version\": \"${TAG#v}\"" -- package.json)"
          target="${target:-$GITHUB_SHA}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            target="$(git rev-parse "$TAG^{commit}")"
            # Earlier versions of this workflow pushed unsigned annotated tags and no
            # release. Replace such a tag (only one this workflow made) with the
            # release's lightweight tag on the same commit.
            if [ "$(git cat-file -t "refs/tags/$TAG")" = "tag" ] && \
               [ "$(git for-each-ref "refs/tags/$TAG" --format='%(taggername)')" = "github-actions[bot]" ]; then
              git push origin ":refs/tags/$TAG"
            fi
          fi
          gh release create "$TAG" --target "$target" --title "Release ${TAG#v}" --generate-notes --latest

      # Rebuild demo.uniport.dev so it installs the new version (its Vercel build runs
      # `npm install uniport-sdk@latest`). Enabled by the DEMO_DEPLOY_HOOK repository
      # secret, a Vercel deploy hook URL for the uniport-demo project.
      - name: Redeploy the demo
        if: steps.plan.outputs.publish == 'true' && env.DEMO_DEPLOY_HOOK != ''
        env:
          DEMO_DEPLOY_HOOK: ${{ secrets.DEMO_DEPLOY_HOOK }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          # npm can take a few minutes to serve a new version; wait so the demo
          # doesn't rebuild with the previous one.
          for i in $(seq 1 40); do
            latest="$(npm view uniport-sdk dist-tags.latest 2>/dev/null || true)"
            [ "$latest" = "$VERSION" ] && break
            sleep 15
          done
          echo "npm latest: $latest (released $VERSION)"
          curl -fsS -X POST "$DEMO_DEPLOY_HOOK" > /dev/null
